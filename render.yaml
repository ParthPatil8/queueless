# Render Blueprint: one web service serves both the API and the built React app (same origin, no CORS needed).
services:
  - type: web
    name: queueless
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22
      - key: ADMIN_USERNAME
        sync: false   # you type these in the Render dashboard; they are never stored in Git
      - key: ADMIN_PASSWORD
        sync: false
      - key: STAFF_USERNAME
        sync: false
      - key: STAFF_PASSWORD
        sync: false
